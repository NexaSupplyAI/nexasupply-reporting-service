server:
  port: 8084

spring:
  application:
    name: reporting-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: reporting

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

clients:
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8082}
  supplier-service:
    base-url: ${SUPPLIER_SERVICE_URL:http://localhost:8083}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${HTTP_READ_TIMEOUT:10s}
  authentication:
    mode: ${INTER_SERVICE_AUTH_MODE:propagate}
    scope: ${AZURE_INTER_SERVICE_SCOPE:}

reports:
  storage:
    type: ${REPORT_STORAGE_TYPE:local}
    local-directory: ${REPORT_LOCAL_DIRECTORY:./build/reports}
    blob-endpoint: ${REPORT_BLOB_ENDPOINT:}
    blob-container: ${REPORT_BLOB_CONTAINER:reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
